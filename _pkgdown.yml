url: https://thisistaimur.github.io/maxentgpu/

template:
  bootstrap: 5
  bslib:
    bg: "#f7f8fc"
    fg: "#21143f"
    primary: "#512580"
    secondary: "#35558f"
    success: "#58c95b"
    info: "#249995"
    warning: "#f3d51b"
    link-color: "#512580"
    link-hover-color: "#249995"
    border-radius: 0.75rem
    btn-border-radius: 0.6rem
    base_font: "system-ui"
    heading_font: "system-ui"

navbar:
  structure:
    left: [reference, articles, tutorials, news]
    right: [github, lightswitch]

development:
  mode: auto

home:
  title: Maximum-Entropy Presence-Background Models with Torch
  description: >
    Auditable maximum-entropy presence-background models on CPU and supported
    Torch accelerators.

reference:
  - title: Backend diagnostics
    contents:
      - maxent_device_probe
      - maxent_accelerators
  - title: Feature construction
    contents:
      - maxent_feature_spec
      - maxent_feature_matrix
      - maxent_auto_features
  - title: Scalar fitting and models
    contents:
      - maxent_fit
      - predict.maxent_fit
      - maxent_diagnostics
      - maxent_coefficients
      - summary.maxent_fit
      - save_maxent_model
      - read_maxent_model
  - title: Independent-species batches
    contents:
      - maxent_fit_batch
      - predict.maxent_batch_model
