# Derived from https://github.com/r-lib/actions/tree/v2/examples/pkgdown.yaml
name: pkgdown

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions: read-all

jobs:
  version:
    name: Calculate site version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release-version.outputs.version || steps.semver.outputs.version-string }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Use published release version
        id: release-version
        if: github.event_name == 'release'
        shell: bash
        run: echo "version=${GITHUB_EVENT_RELEASE_TAG_NAME#v}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_EVENT_RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
      - name: Calculate Semantic Version for main
        id: semver
        if: github.event_name != 'release'
        uses: bitshifted/git-auto-semver@v2
        with:
          create_tag: false
          main_branch: main
          initial_version: 0.1.0

  pkgdown:
    needs: version
    runs-on: ubuntu-latest
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Use the matching release version
        if: github.event_name != 'pull_request'
        run: Rscript .github/scripts/set-version.R "${{ needs.version.outputs.version }}"
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website
      - name: Build site
        run: Rscript tools/build-pkgdown.R .
      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
